<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Legitymacja studencka</title>
<style>
*{
margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#1c1c1e;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;min-height:100vh}
.phone{width:100%;max-width:430px;background:#f2f2f7;position:relative}
.content{position:relative;width:100%}
.part{width:100%;height:auto;display:block}
.time-cover{position:absolute;top:44px;left:14%;right:14%;height:24px;background:#f2f2f7;z-index:5}
.live-time{position:absolute;top:46px;left:0;right:0;text-align:center;font-size:13px;color:#8e8e93;z-index:10;pointer-events:none;font-weight:400}
</style>
</head>
<body>
<div class="phone">
<div class="content">
<div class="time-cover"></div>
<div class="live-time" id="liveTime">Czas: --:--:-- --.--.----</div>
<img src="data:image/jpeg;base64,PLACEHOLDER1" class="part" alt="Legitymacja">
<img src="data:image/jpeg;base64,PLACEHOLDER2" class="part" alt="Szczegoly">
</div>
</div>
<script>
function updateTime(){const n=new Date(),h=String(n.getHours()).padStart(2,"0"),m=String(n.getMinutes()).padStart(2,"0"),s=String(n.getSeconds()).padStart(2,"0"),d=String(n.getDate()).padStart(2,"0"),mo=String(n.getMonth()+1).padStart(2,"0"),y=n.getFullYear();document.getElementById("liveTime").textContent=`Czas: ${h}:${m}:${s} ${d}.${mo}.${y}`}
updateTime();setInterval(updateTime,1000);
</script>
</body>
</html>
